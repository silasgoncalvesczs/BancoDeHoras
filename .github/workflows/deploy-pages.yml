name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish folder
        run: |
          mkdir -p publish
          # Copia o site sem depender do .gitignore do artefato do Pages
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'publish' \
            --exclude 'supabase' \
            --exclude 'migration' \
            --exclude 'js/supabase-config.js' \
            --exclude 'js/firebase-config.js' \
            ./ publish/

      - name: Generate Supabase config from Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          keys = ["SUPABASE_URL", "SUPABASE_ANON_KEY"]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              raise SystemExit(f"Missing secrets: {', '.join(missing)}")

          url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          if not url.startswith("https://"):
              raise SystemExit("SUPABASE_URL deve começar com https://")

          # Trava de segurança: nunca publicar a chave secreta no site.
          import base64
          key = os.environ["SUPABASE_ANON_KEY"].strip()
          if key.startswith("sb_secret_"):
              raise SystemExit("SUPABASE_ANON_KEY contém uma chave SECRETA. Use a anon/publishable.")
          parts = key.split(".")
          if len(parts) == 3:
              try:
                  payload = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
              except Exception:
                  payload = {}
              if payload.get("role") == "service_role":
                  raise SystemExit("SUPABASE_ANON_KEY é a service_role. Use a chave anon.")

          out = Path("publish/js/supabase-config.js")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              "\n".join(
                  [
                      "/**",
                      " * Gerado automaticamente no deploy (GitHub Actions).",
                      " * Nao editar manualmente neste ambiente.",
                      " */",
                      "export const supabaseConfig = {",
                      f"  url: {json.dumps(url)},",
                      f"  anonKey: {json.dumps(os.environ['SUPABASE_ANON_KEY'].strip())},",
                      "};",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          print(f"generated {out} ({out.stat().st_size} bytes)")
          PY

      - name: Verify publish contents
        run: |
          test -f publish/js/supabase-config.js
          test -f publish/js/supabase.js
          test -f publish/js/images.js
          test -f publish/index.html
          test -f publish/sw.js
          echo "publish/js:"
          ls -la publish/js/
          echo "Config OK ($(wc -c < publish/js/supabase-config.js) bytes)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
