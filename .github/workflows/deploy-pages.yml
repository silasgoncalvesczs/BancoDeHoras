name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Firebase config from Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          keys = [
              "FIREBASE_API_KEY",
              "FIREBASE_AUTH_DOMAIN",
              "FIREBASE_PROJECT_ID",
              "FIREBASE_STORAGE_BUCKET",
              "FIREBASE_MESSAGING_SENDER_ID",
              "FIREBASE_APP_ID",
          ]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              raise SystemExit(f"Missing secrets: {', '.join(missing)}")

          def q(name: str) -> str:
              return json.dumps(os.environ[name])

          Path("js/firebase-config.js").write_text(
              "\n".join(
                  [
                      "/**",
                      " * Gerado automaticamente no deploy (GitHub Actions).",
                      " * Nao editar manualmente neste ambiente.",
                      " */",
                      "export const firebaseConfig = {",
                      f"  apiKey: {q('FIREBASE_API_KEY')},",
                      f"  authDomain: {q('FIREBASE_AUTH_DOMAIN')},",
                      f"  projectId: {q('FIREBASE_PROJECT_ID')},",
                      f"  storageBucket: {q('FIREBASE_STORAGE_BUCKET')},",
                      f"  messagingSenderId: {q('FIREBASE_MESSAGING_SENDER_ID')},",
                      f"  appId: {q('FIREBASE_APP_ID')},",
                      "};",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          print("firebase-config.js generated")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
